name: Build

on:
  workflow_dispatch: {}
  push:
    branches: [ master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master ]

env:
  CMAKE_BUILD_TYPE: Release
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  QT_VERSION: "6.7.3"
  QT_MAJOR_VERSION: 6
  PYTHON_VERSION: "3.11"
  PYTHON_MAJOR_VERSION: 3
  PYTHON_MINOR_VERSION: 11
  OPENSSL_VERSION: "1.1.1.2100"
  PYTHONQT_TAG: "v4.0.1"

jobs:
  build:
    name: Build - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86_64)
            os: ubuntu-22.04
            arch: x86_64
            qt_arch: linux_gcc_64
            qt_host: linux
            artifact_name: ScreenCloud-Linux-x86_64
          - name: Linux (arm64)
            os: ubuntu-22.04-arm
            arch: aarch64
            qt_arch: linux_gcc_arm64
            qt_host: linux_arm64
            artifact_name: ScreenCloud-Linux-arm64
          - name: macOS (Intel)
            os: macos-15-intel
            arch: x86_64
            qt_arch: clang_64
            qt_host: mac
            artifact_name: ScreenCloud-macOS-Intel
          - name: macOS (Apple Silicon)
            os: macos-15
            arch: arm64
            qt_arch: clang_64
            qt_host: mac
            artifact_name: ScreenCloud-macOS-arm64
          - name: Windows (x64)
            os: windows-2022
            arch: x64
            platform: x64
            qt_arch: win64_msvc2019_64
            qt_host: windows
            artifact_name: ScreenCloud-Windows-x64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.29.0"
          ninjaVersion: "^1.0.0"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          host: ${{ matrix.qt_host }}
          cache: true
          archives: qtbase qttools qtdeclarative qtmultimedia qtsvg qtimageformats icu
          modules: qtmultimedia qt5compat

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Linux dependencies
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev zlib1g-dev \
            libx11-dev libxcb1-dev libxext-dev libxfixes-dev libxi-dev \
            libxrender-dev libxcb-cursor-dev libxcb-image0-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-render-util0-dev libxcb-shape0-dev \
            libxcb-sync-dev libxcb-util-dev libxcb-xfixes0-dev libxcb-xinerama0-dev \
            libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            mesa-common-dev libgl1-mesa-dev libglu1-mesa-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev \
            libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev gstreamer1.0-plugins-bad \
            libmariadb-dev libfuse2

          pip3 install --no-binary :all: ssh2-python

      # macOS dependencies
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          pip3 install ssh2-python

      # Required on Windows so nmake and cl.exe are available in subsequent bash steps
      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      # Windows dependencies
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Install WiX Toolset
          choco install wixtoolset -y
 
          # Install 7zip
          choco install 7zip
 
          # Install zlib
          Invoke-WebRequest -Uri "https://www.zlib.net/fossils/zlib-1.3.1.tar.gz" -OutFile "zlib-1.3.1.tar.gz"
          tar -xzf "zlib-1.3.1.tar.gz"
          Set-Location "zlib-1.3.1"
          $ZLIB_BUILD_PATH = (Get-Location).Path
          cmake . -DCMAKE_INSTALL_PREFIX="$ZLIB_BUILD_PATH" -A ${{ matrix.platform }}
          cmake --build . --config Release --target install
          "ZLIB_BASE_DIR=$ZLIB_BUILD_PATH" | Out-File -Append -FilePath $env:GITHUB_ENV

          # Add to PATH
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

          # Install OpenSSL and libssh2 via vcpkg
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg" install openssl:${{ matrix.arch }}-windows libssh2:${{ matrix.arch }}-windows
          $VCPKG_INSTALLED = "$env:VCPKG_INSTALLATION_ROOT\installed\${{ matrix.arch }}-windows"
          "OPENSSL_ROOT_DIR=$VCPKG_INSTALLED" | Out-File -Append -FilePath $env:GITHUB_ENV

          # Install Python packages
          py -${{ env.PYTHON_VERSION }} -m pip install --upgrade pip
          # ssh2-python's generated fileinfo.c references st_blksize and st_blocks which
          # don't exist in Windows' _stat64, causing C2039/C2198 errors. Patch them to 0
          # before building - they're POSIX-only fields with no Windows equivalent.
          $SSH2_SRC = "$env:RUNNER_TEMP\ssh2-src"
          py -${{ env.PYTHON_VERSION }} -m pip download --no-binary :all: --no-deps -d $SSH2_SRC ssh2-python
          $tarball = Get-ChildItem "$SSH2_SRC\ssh2_python*.tar.gz" | Select-Object -First 1
          tar -xzf $tarball.FullName -C $SSH2_SRC
          $srcDir = Get-ChildItem $SSH2_SRC -Directory | Select-Object -First 1
          # fileinfo.c and statinfo.c both reference st_blksize/st_blocks which don't
          # exist in Windows' stat struct, causing C2039/C2198 errors. Patch both files.
          foreach ($cFile in @('fileinfo.c', 'statinfo.c')) {
            $cPath = Join-Path $srcDir.FullName "ssh2\$cFile"
            (Get-Content $cPath) | ForEach-Object {
              if ($_ -match 'st_blksize') { $_ -replace '__Pyx_PyLong_From_long\(.*\)', '__Pyx_PyLong_From_long(0)' }
              elseif ($_ -match 'st_blocks') { $_ -replace '__Pyx_PyLong_From_long\(.*\)', '__Pyx_PyLong_From_long(0)' }
              else { $_ }
            } | Set-Content $cPath -Encoding utf8
          }
          New-Item -ItemType SymbolicLink -Path "$VCPKG_INSTALLED\lib\libcrypto64MD.lib" -Target "$VCPKG_INSTALLED\lib\libcrypto.lib"
          New-Item -ItemType SymbolicLink -Path "$VCPKG_INSTALLED\lib\libssl64MD.lib"    -Target "$VCPKG_INSTALLED\lib\libssl.lib"
          $env:INCLUDE = "$VCPKG_INSTALLED\include;$env:INCLUDE"
          $env:LIB = "$VCPKG_INSTALLED\lib;$ZLIB_BUILD_PATH\lib;$env:LIB"
          py -${{ env.PYTHON_VERSION }} -m pip install $srcDir.FullName

      # Build QuaZip
      - name: Build QuaZip
        shell: bash
        run: |
          git clone https://github.com/stachenov/quazip.git
          cd quazip
          git checkout v1.4
          mkdir -p build
          cd build

          if [ "$RUNNER_OS" == "Windows" ]; then
            cmake .. \
              -G "Visual Studio 17 2022" \
              -A ${{ matrix.platform }} \
              -DCMAKE_PREFIX_PATH="${Qt6_DIR}" \
              -DCMAKE_INSTALL_PREFIX="../install" \
              -DBUILD_SHARED_LIBS=ON \
              -DZLIB_INCLUDE_DIR="${ZLIB_BASE_DIR}/include" \
              -DZLIB_LIBRARY="${ZLIB_BASE_DIR}/lib/zlib.lib"
            cmake --build . --config Release --target install
          else
            cmake .. \
              -G Ninja \
              -DCMAKE_PREFIX_PATH="${Qt6_DIR}" \
              -DCMAKE_INSTALL_PREFIX="../install" \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON
            ninja install
          fi

          echo "QUAZIP_DIR=$(pwd)/../install" >> $GITHUB_ENV

      - name: Build PythonQt
        shell: bash
        run: |
          git clone --branch ${{ env.PYTHONQT_TAG }} https://github.com/mevislab/PythonQt
          cd PythonQt

          # Resolve Python paths via sysconfig so they work on all three OSes
          PYTHON_PATH=$(python -c "import sys; print(sys.prefix)")
          PYTHON_LIBRARY_DIR=$(python -c "
          import sysconfig, glob, os
          b = sysconfig.get_config_var('base')
          candidates = [
            sysconfig.get_config_var('LIBPL') or os.path.join(b, 'libs'),
            sysconfig.get_config_var('LIBDIR'),
          ]
          print(next(
            (p for p in candidates
             if p and any(glob.glob(p + '/*' + e) for e in ('.lib', '.so', '.dylib'))),
            ''
          ))")

          # QT_ROOT_DIR is set by jurplel/install-qt-action to the arch-specific Qt root
          # e.g. /home/runner/work/Qt/5.15.2/gcc_64
          QTDIR="${QT_ROOT_DIR}"

          NPROC=$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 2)

          if [ "$RUNNER_OS" == "Windows" ]; then
            # cygpath converts Unix-style paths to Windows-style for qmake/nmake
            PYTHON_PATH_W=$(cygpath -w "${PYTHON_PATH}")
            PYTHON_LIB_W=$(cygpath -w "${PYTHON_LIBRARY_DIR}")
            QTDIR_W=$(cygpath -w "${QTDIR}")
            # Git Bash's /usr/bin/link shadows MSVC's link.exe; remove it
            rm -f /usr/bin/link

            # Build the binding generator
            qmake \
              CONFIG+=generator_only CONFIG+=Release \
              PYTHON_VERSION=${{ env.PYTHON_VERSION }} \
              PYTHON_PATH="${PYTHON_PATH_W}" \
              PYTHON_LIB="${PYTHON_LIB_W}" \
              QTDIR="${QTDIR_W}" \
              PythonQt.pro
            nmake

            # Run the generator to produce generated_cpp/
            cd generator
            release/pythonqt_generator.exe qtscript_masterinclude.h build_all.txt
            cd ..

            # Build the full runtime (generator excluded)
            qmake \
              CONFIG+=Release CONFIG+=exclude_generator \
              PYTHON_VERSION=${{ env.PYTHON_VERSION }} \
              PYTHON_PATH="${PYTHON_PATH_W}" \
              PYTHON_LIB="${PYTHON_LIB_W}" \
              QTDIR="${QTDIR_W}" \
              PythonQt.pro
            nmake

          else
            # Fix issues with multi-arch and -lintl on mac os
            if [ "$RUNNER_OS" == "macOS" ]; then
              GETTEXT_LIB="$(brew --prefix gettext)/lib"
              QMAKE_EXTRA_ARGS=(
                "LIBS+=-L${GETTEXT_LIB}"
                "QMAKE_LFLAGS+=-L${GETTEXT_LIB}"
                "LIBS+=-L${PYTHON_LIBRARY_DIR}"
                "QMAKE_LFLAGS+=-L${PYTHON_LIBRARY_DIR}"
                "QMAKE_RPATHDIR+=${PYTHON_LIBRARY_DIR}"
                "QMAKE_APPLE_DEVICE_ARCHS=${{ matrix.arch }}"
              )
            else
              QMAKE_EXTRA_ARGS=()
            fi

            # Build the binding generator
            qmake \
              CONFIG+=generator_only CONFIG+=Release \
              PYTHON_VERSION=${{ env.PYTHON_VERSION }} \
              PYTHON_PATH="${PYTHON_PATH}" \
              PYTHON_DIR="${PYTHON_PATH}" \
              QTDIR="${QTDIR}" \
              -after "${QMAKE_EXTRA_ARGS[@]}" \
              PythonQt.pro
            make -j${NPROC}

            # Run the generator to produce generated_cpp/
            cd generator
            ./pythonqt_generator qtscript_masterinclude.h build_all.txt
            cd ..

            # Build the full runtime (generator excluded)
            qmake \
              CONFIG+=Release CONFIG+=exclude_generator \
              PYTHON_VERSION=${{ env.PYTHON_VERSION }} \
              PYTHON_PATH="${PYTHON_PATH}" \
              PYTHON_DIR="${PYTHON_PATH}" \
              QTDIR="${QTDIR}" \
              -after "${QMAKE_EXTRA_ARGS[@]}" \
              PythonQt.pro
            make -j${NPROC}
          fi

          # macOS: qmake sets bare install names; rewrite to @rpath so macdeployqt can find them
          if [ "$RUNNER_OS" == "macOS" ]; then
            PQ_LIB=$(find lib -name "libPythonQt-Qt6*.dylib" ! -name "*QtAll*" ! -name "*.0.dylib" ! -name "*.2.dylib" 2>/dev/null | grep -v '\.3\.2\.' | head -1)
            PQ_QTALL_LIB=$(find lib -name "libPythonQt_QtAll-Qt6*.dylib" ! -name "*.0.dylib" ! -name "*.2.dylib" 2>/dev/null | grep -v '\.3\.2\.' | head -1)
 
            PQ_LIB_BASENAME=$(basename "${PQ_LIB}")
            PQ_QTALL_LIB_BASENAME=$(basename "${PQ_QTALL_LIB}")
 
            install_name_tool -id "@rpath/${PQ_LIB_BASENAME}"      "${PQ_LIB}"
            install_name_tool -id "@rpath/${PQ_QTALL_LIB_BASENAME}" "${PQ_QTALL_LIB}"
 
            # Fix QtAll's reference to the core dylib
            OLD_PQ_REF=$(otool -L "${PQ_QTALL_LIB}" | awk '/libPythonQt-Qt6/ && !/QtAll/ {print $1}')
            if [ -n "${OLD_PQ_REF}" ]; then
              install_name_tool -change "${OLD_PQ_REF}" "@rpath/${PQ_LIB_BASENAME}" "${PQ_QTALL_LIB}"
            fi
          fi
 
          PYTHONQT_DIR=$(pwd)
          echo "PYTHONQT_DIR=${PYTHONQT_DIR}" >> $GITHUB_ENV

          # Locate the built libraries dynamically
          if [ "$RUNNER_OS" == "Windows" ]; then
            PYTHONQT_LIB=$(find lib -name "PythonQt*.lib" ! -name "*QtAll*" 2>/dev/null | head -1)
            PYTHONQT_QTALL_LIB=$(find lib -name "PythonQt*QtAll*.lib" 2>/dev/null | head -1)
          elif [ "$RUNNER_OS" == "macOS" ]; then
            PYTHONQT_LIB=$(find lib -name "libPythonQt-Qt6*.dylib" ! -name "*QtAll*" ! -name "*.0.dylib" ! -name "*.2.dylib" 2>/dev/null | grep -v '\.3\.2\.' | head -1)
            PYTHONQT_QTALL_LIB=$(find lib -name "libPythonQt_QtAll-Qt6*.dylib" ! -name "*.0.dylib" ! -name "*.2.dylib" 2>/dev/null | grep -v '\.3\.2\.' | head -1)
          else
            PYTHONQT_LIB=$(find lib -name "libPythonQt*.so" ! -name "*QtAll*" 2>/dev/null | head -1)
            PYTHONQT_QTALL_LIB=$(find lib -name "libPythonQt*QtAll*.so" 2>/dev/null | head -1)
          fi

          if [ -z "${PYTHONQT_LIB}" ] || [ -z "${PYTHONQT_QTALL_LIB}" ]; then
            echo "ERROR: Could not locate PythonQt libraries under $(pwd)/lib"
            find . -name "libPythonQt*" -o -name "PythonQt*.lib" 2>/dev/null
            exit 1
          fi

          echo "PYTHONQT_LIB=${PYTHONQT_DIR}/${PYTHONQT_LIB}" >> $GITHUB_ENV
          echo "PYTHONQT_QTALL_LIB=${PYTHONQT_DIR}/${PYTHONQT_QTALL_LIB}" >> $GITHUB_ENV

      - name: Build ScreenCloud
        shell: bash
        run: |
          mkdir build
          cd build

          PYTHON_INCLUDE_DIR=$(python -c "import sysconfig; print(sysconfig.get_path('include'))")
          PYTHON_LIBRARY_DIR=$(python -c "import sysconfig,glob,os; b=sysconfig.get_config_var('base'); print(next((p for p in ((sysconfig.get_config_var('LIBPL') or os.path.join(b,'libs')), sysconfig.get_config_var('LIBDIR')) if p and any(glob.glob(p+'/*'+e) for e in ('.lib','.so','.dylib'))), ''))")

          if [ "$RUNNER_OS" == "Windows" ]; then
            PYTHON_DIR=$(python -c "import sys; import os; print(os.path.dirname(sys.executable))")
            cmake .. \
              -G "Visual Studio 17 2022" \
              -A ${{ matrix.platform }} \
              -DCMAKE_PREFIX_PATH="${Qt6_DIR}" \
              -DCMAKE_BUILD_TYPE=Release \
              -DZLIB_ROOT="${ZLIB_BASE_DIR}" \
              -DQUAZIP_INCLUDE_DIR="${QUAZIP_DIR}/include/QuaZip-Qt6-1.4/quazip" \
              -DQUAZIP_LIBRARY="${QUAZIP_DIR}/lib/quazip1-qt6.lib" \
              -DPYTHON_INCLUDE_DIR="${PYTHON_INCLUDE_DIR}" \
              -DPYTHON_LIBRARY="${PYTHON_LIBRARY_DIR}/python${{ env.PYTHON_MAJOR_VERSION }}${{ env.PYTHON_MINOR_VERSION }}.lib" \
              -DPYTHONQT_INCLUDE_DIR="${PYTHONQT_DIR}/src" \
              -DPYTHONQT_LIBRARY="${PYTHONQT_LIB}" \
              -DPYTHONQT_QTALL_INCLUDE_DIR="${PYTHONQT_DIR}/extensions/PythonQt_QtAll" \
              -DPYTHONQT_QTALL_LIBRARY="${PYTHONQT_QTALL_LIB}" \
              -DOPENSSL_ROOT_DIR="${OPENSSL_ROOT_DIR}"
            cmake --build . --config Release

          elif [ "$RUNNER_OS" == "macOS" ]; then
            cmake .. \
              -G Ninja \
              -DCMAKE_PREFIX_PATH="${Qt6_DIR}" \
              -DCMAKE_BUILD_TYPE=Release \
              -DQUAZIP_INCLUDE_DIR="${QUAZIP_DIR}/include/QuaZip-Qt6-1.4/quazip" \
              -DQUAZIP_LIBRARY="${QUAZIP_DIR}/lib/libquazip1-qt6.dylib" \
              -DPYTHON_INCLUDE_DIR="${PYTHON_INCLUDE_DIR}" \
              -DPYTHON_LIBRARY="${PYTHON_LIBRARY_DIR}/libpython${{ env.PYTHON_VERSION }}.dylib" \
              -DPYTHONQT_INCLUDE_DIR="${PYTHONQT_DIR}/src" \
              -DPYTHONQT_LIBRARY="${PYTHONQT_LIB}" \
              -DPYTHONQT_QTALL_INCLUDE_DIR="${PYTHONQT_DIR}/extensions/PythonQt_QtAll" \
              -DPYTHONQT_QTALL_LIBRARY="${PYTHONQT_QTALL_LIB}"
            ninja

          else
            cmake .. \
              -G Ninja \
              -DCMAKE_PREFIX_PATH="${Qt6_DIR}" \
              -DCMAKE_BUILD_TYPE=Release \
              -DQUAZIP_INCLUDE_DIR="${QUAZIP_DIR}/include/QuaZip-Qt6-1.4/quazip" \
              -DQUAZIP_LIBRARY="${QUAZIP_DIR}/lib/libquazip1-qt6.so" \
              -DPYTHON_INCLUDE_DIR="${PYTHON_INCLUDE_DIR}" \
              -DPYTHON_LIBRARY="${PYTHON_LIBRARY_DIR}/libpython${{ env.PYTHON_VERSION }}.so" \
              -DPYTHONQT_INCLUDE_DIR="${PYTHONQT_DIR}/src" \
              -DPYTHONQT_LIBRARY="${PYTHONQT_LIB}" \
              -DPYTHONQT_QTALL_INCLUDE_DIR="${PYTHONQT_DIR}/extensions/PythonQt_QtAll" \
              -DPYTHONQT_QTALL_LIBRARY="${PYTHONQT_QTALL_LIB}"
            ninja
          fi

      # Package Linux (AppImage)
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          cd build
          DESTDIR=appdir cmake --build . --config Release --target install

          # Bundle the Python standard library into the AppImage
          PYTHON_PREFIX=$(python -c "import sys; print(sys.prefix)")
          PYTHON_VERSION_DIR="python${{ env.PYTHON_MAJOR_VERSION }}.${{ env.PYTHON_MINOR_VERSION }}"
          mkdir -p appdir/usr/local/lib/${PYTHON_VERSION_DIR}
          cp -r "${PYTHON_PREFIX}/lib/${PYTHON_VERSION_DIR}/." \
            appdir/usr/local/lib/${PYTHON_VERSION_DIR}
          # Remove test dirs and __pycache__ to save space
          find appdir/usr/local/lib/${PYTHON_VERSION_DIR} \
            -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true
          rm -rf appdir/usr/local/lib/${PYTHON_VERSION_DIR}/test
          rm -rf appdir/usr/local/lib/${PYTHON_VERSION_DIR}/ensurepip

          # Download linuxdeployqt
          wget -c -nv "https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-${{ matrix.arch }}.AppImage"
          chmod a+x linuxdeployqt-continuous-${{ matrix.arch }}.AppImage

          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$(dirname "${PYTHONQT_LIB}"):$QUAZIP_DIR/lib

          # Prepare appdir
          ./linuxdeployqt-continuous-${{ matrix.arch }}.AppImage appdir/usr/local/share/applications/*.desktop \
            -bundle-non-qt-libs \
            -exclude-libs=libqsqlmimer,libmariadb \
            -verbose=2

          # Overwrite the generated AppRun to use screencloud.sh
          cat > appdir/AppRun << 'EOF'
          #!/bin/bash
          APPDIR="$(dirname "$(readlink -f "$0")")"
          exec "${APPDIR}/usr/local/bin/screencloud.sh" "$@"
          EOF
          chmod +x appdir/AppRun

          # appimagetool needs the desktop file and icon at the appdir root
          cp appdir/usr/local/share/applications/*.desktop appdir/
          cp appdir/usr/screencloud.png appdir/

          # Repack into AppImage
          wget -c -nv "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage"
          chmod a+x appimagetool-${{ matrix.arch }}.AppImage
          ARCH=${{ matrix.arch }} ./appimagetool-${{ matrix.arch }}.AppImage appdir ScreenCloud-${GITHUB_SHA::7}-${{ matrix.arch }}.AppImage

          rm linuxdeployqt-continuous-${{ matrix.arch }}.AppImage
          rm ./appimagetool-${{ matrix.arch }}.AppImage

      # Package macOS
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          cd build
          cmake --build . --config Release --target install
 
          APP="screencloud.app"
          FRAMEWORKS="${APP}/Contents/Frameworks"
          MACOS="${APP}/Contents/MacOS"
 
          # 1. Copy PythonQt dylibs into Frameworks/; install names were already fixed to @rpath in the build step
          PQ_LIB_BASENAME=$(basename "${PYTHONQT_LIB}")
          PQ_QTALL_LIB_BASENAME=$(basename "${PYTHONQT_QTALL_LIB}")
          mkdir -p "${FRAMEWORKS}"
          cp "${PYTHONQT_LIB}"       "${FRAMEWORKS}/${PQ_LIB_BASENAME}"
          cp "${PYTHONQT_QTALL_LIB}" "${FRAMEWORKS}/${PQ_QTALL_LIB_BASENAME}"
 
          # 2. Embed a slim Python framework (shared lib + stdlib only, no Tcl/Tk or test suites)
          PYTHON_PREFIX=$(python -c "import sys; print(sys.prefix)")
          PY_VER="${{ env.PYTHON_VERSION }}"
          BUNDLE_PY_FWK="${FRAMEWORKS}/Python.framework"
          BUNDLE_PY_VER="${BUNDLE_PY_FWK}/Versions/${PY_VER}"
          mkdir -p "${BUNDLE_PY_VER}/lib"
          cp "${PYTHON_PREFIX}/lib/libpython${PY_VER}.dylib" "${BUNDLE_PY_VER}/Python"
          rsync -a --exclude='__pycache__' --exclude='test' --exclude='tests' \
            --exclude='ensurepip' \
            "${PYTHON_PREFIX}/lib/python${PY_VER}/" \
            "${BUNDLE_PY_VER}/lib/python${PY_VER}/"
          ln -sf "${PY_VER}"              "${BUNDLE_PY_FWK}/Versions/Current"
          ln -sf "Versions/Current/Python" "${BUNDLE_PY_FWK}/Python"

          # Add Resources so codesign recognizes it as a valid framework bundle
          mkdir -p "${BUNDLE_PY_VER}/Resources"
          cat > "${BUNDLE_PY_VER}/Resources/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>org.python.python</string>
              <key>CFBundleName</key>
              <string>Python</string>
              <key>CFBundleVersion</key>
              <string>${PY_VER}</string>
          </dict>
          </plist>
          EOF
          ln -sf "Versions/Current/Resources" "${BUNDLE_PY_FWK}/Resources"

          # Fix the embedded library's own install name
          install_name_tool -id \
            "@rpath/Python.framework/Versions/${PY_VER}/Python" \
            "${BUNDLE_PY_VER}/Python"
 
          # 3. Rewrite all references to the build-host Python path (toolcache and /Library/Frameworks variants)
          OLD_PYTHON_LIB="${PYTHON_PREFIX}/lib/libpython${PY_VER}.dylib"
          NEW_PYTHON_LIB="@rpath/Python.framework/Versions/${PY_VER}/Python"
          SYSTEM_PYTHON_LIB="/Library/Frameworks/Python.framework/Versions/${PY_VER}/Python"
          for BINARY in \
            "${MACOS}/screencloud-"* \
            "${FRAMEWORKS}/${PQ_LIB_BASENAME}" \
            "${FRAMEWORKS}/${PQ_QTALL_LIB_BASENAME}"; do
            if otool -L "${BINARY}" | grep -q "${OLD_PYTHON_LIB}"; then
              install_name_tool -change "${OLD_PYTHON_LIB}" "${NEW_PYTHON_LIB}" "${BINARY}"
            fi
            if otool -L "${BINARY}" | grep -q "${SYSTEM_PYTHON_LIB}"; then
              install_name_tool -change "${SYSTEM_PYTHON_LIB}" "${NEW_PYTHON_LIB}" "${BINARY}"
            fi
          done

          # Manually copy OpenSSL libraries into Frameworks/
          OPENSSL_PREFIX=$(brew --prefix openssl)
          cp "${OPENSSL_PREFIX}/lib/libssl.3.dylib"    "${FRAMEWORKS}/"
          cp "${OPENSSL_PREFIX}/lib/libcrypto.3.dylib" "${FRAMEWORKS}/"
 
          # 4. Run macdeployqt to handle Qt frameworks, plugins, and remaining dylibs (quazip, etc.)
          macdeployqt "${APP}" -verbose=2

          # Fix hardcoded OpenSSL paths in Python extension modules
          PY_DYNLOAD="${BUNDLE_PY_VER}/lib/python${PY_VER}/lib-dynload"
          FRAMEWORKS_RELPATH="@loader_path/../../../../../../"

          for SO in "${PY_DYNLOAD}"/*.so; do
            if ! otool -L "${SO}" | grep -q "libssl\|libcrypto"; then
              continue
            fi

            ARCHS=$(lipo -archs "${SO}" 2>/dev/null)
            TMPDIR=$(mktemp -d)
            LIPO_ARGS=""

            for ARCH in ${ARCHS}; do
              SLICE="${TMPDIR}/${ARCH}.so"
              lipo "${SO}" -thin "${ARCH}" -output "${SLICE}"

              OLD_SSL=$(otool -L "${SLICE}" 2>/dev/null | awk '/libssl/ {print $1}')
              OLD_CRYPTO=$(otool -L "${SLICE}" 2>/dev/null | awk '/libcrypto/ {print $1}')

              [ -n "${OLD_SSL}" ] && install_name_tool -change "${OLD_SSL}" \
                "${FRAMEWORKS_RELPATH}libssl.3.dylib" "${SLICE}"
              [ -n "${OLD_CRYPTO}" ] && install_name_tool -change "${OLD_CRYPTO}" \
                "${FRAMEWORKS_RELPATH}libcrypto.3.dylib" "${SLICE}"

              LIPO_ARGS="${LIPO_ARGS} -arch ${ARCH} ${SLICE}"
            done

            lipo -create ${LIPO_ARGS} -output "${SO}"
            rm -rf "${TMPDIR}"
          done

          # 5. Sign frameworks first, then the main executable, then the bundle

          # Sign frameworks and plugins
          find "${APP}/Contents/Frameworks" -name "*.dylib" -o -name "*.so" | while read f; do
            echo "Signing $f..."
            codesign --force --sign - "$f"
          done

          find "${APP}/Contents/Frameworks" -name "*.framework" | while read f; do
            echo "Signing $f..."
            codesign --force --sign - "$f"
          done

          find "${APP}/Contents/PlugIns" -name "*.dylib" | while read f; do
            echo "Signing $f..."
            codesign --force --sign - "$f"
          done

          # Sign any helper apps
          find "${APP}/Contents" -name "*.app" | while read f; do
            echo "Signing $f..."
            codesign --force --sign - "$f"
          done

          # Sign the main executable
          find "${APP}/Contents/MacOS" -type f | while read f; do
            echo "Signing $f..."
            codesign --force --sign - "$f"
          done

          # codesign requires the main executable to be a real file, not a symlink
          MAIN_EXE="${MACOS}/screencloud"
          if [ -L "${MAIN_EXE}" ]; then
            TARGET=$(readlink "${MAIN_EXE}")
            rm "${MAIN_EXE}"
            ln "${MACOS}/${TARGET}" "${MAIN_EXE}"
          fi

          # Sign the bundle itself
          echo "Signing ${APP}..."
          codesign --force --sign - "${APP}"
 
          # 6. Create the DMG
          DMG_NAME="ScreenCloud-${GITHUB_SHA::7}.dmg"
          hdiutil create \
            -volname "ScreenCloud" \
            -srcfolder "${APP}" \
            -ov \
            -format UDZO \
            "${DMG_NAME}"

      # Package Windows
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd build

          # Copy Python dependencies
          PYTHON_DIR=$(python -c "import sys; import os; print(os.path.dirname(sys.executable))")
          cp -r "${PYTHON_DIR}/DLLs" DLLs
          cp -r ${PYTHON_DIR}/Lib/site-packages/ssh2 modules/ssh2
          7z a -tzip -mx=9 python${PYTHON_MAJOR_VERSION}${PYTHON_MINOR_VERSION}.zip ${PYTHON_DIR}/Lib/*

          cmake --build . --config Release --target install

      # Upload artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            build/*.AppImage
            build/*.dmg
            build/*.msi
          if-no-files-found: error
