name: screencloud
version: "1.6.0"
title: ScreenCloud
summary: Easy to use screenshot sharing application
description: Take a screenshot using one of the 3 hotkeys or simply click the ScreenCloud tray icon. Save your screenshot locally or upload it to the cloud! A link is automatically copied to your clipboard.
license: GPL-2.0
contact: https://screencloud.net
website: https://screencloud.net
issues: https://github.com/olav-st/screencloud/issues
source-code: https://github.com/olav-st/screencloud
confinement: strict
grade: stable
base: core24

plugs: # plugs for theming, font settings, cursor and to use gtk3 file chooser
  gtk-3-themes:
    interface: content
    target: $SNAP/data-dir/themes
    default-provider: gtk-common-themes:gtk-3-themes
  icon-themes:
    interface: content
    target: $SNAP/data-dir/icons
    default-provider: gtk-common-themes:icon-themes
  sound-themes:
    interface: content
    target: $SNAP/data-dir/sounds
    default-provider: gtk-common-themes:sounds-themes

slots:
  session-dbus-interface:
    interface: dbus
    bus: session
    name: org.kde.StatusNotifierItem

apps:
  screencloud:
    extensions: [gnome]
    command: usr/bin/screencloud.sh
    desktop: usr/share/applications/net.screencloud.screencloudapp.desktop
    autostart: net.screencloud.screencloudapp.desktop
    environment:
      DISABLE_WAYLAND: 1 #Disable Qt's Wayland rendering
    slots:
      - session-dbus-interface
    plugs:
      - x11
      - wayland
      - network
      - home
      - opengl
      - audio-playback
      - desktop
      - desktop-legacy
      - screencast-legacy #Access to DBus screenshot APIs
      - gsettings
      - network-bind #A local port is used to check if another screencloud process is running
      - network-manager-observe #To get proxy settings
      - unity7

parts:
  screencloud:
    source: https://github.com/olav-st/screencloud.git
    source-tag: qt6 #TODO: Switch to master
    plugin: cmake
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
    build-packages:
      - g++
      - qt6-5compat-dev
      - qt6-svg-dev
      - qt6-base-dev
      - qt6-base-private-dev
      - qt6-multimedia-dev
      - qt6-tools-dev
      - python3-dev
      - libssl-dev
    stage-packages:
      - openssl
      - libqt6gui6t64
      - libqt6concurrent6t64
      - libqt6multimedia6
      - libqt6widgets6t64
      - libglib2.0-bin
      - libpython3-stdlib
      - qt6-gtk-platformtheme
      - qt6-xdgdesktopportal-platformtheme
      - adwaita-qt6
      - libqt6core5compat6
      - libpython3.12t64
      - libqt6multimediawidgets6
      - libqt6opengl6t64
      - libqt6openglwidgets6t64
      - libqt6printsupport6t64
      - libqt6sql6t64
      - libqt6svgwidgets6
      - libqt6uitools6
      - qt6-qpa-plugins
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-xfixes0
      - libxcb-xkb1
      - libxkbcommon-x11-0
      - yaru-theme-gtk
      - yaru-theme-icon
    override-build: |
      craftctl default
      sed -i 's|Icon=screencloud|Icon=${SNAP}/usr/share/icons/hicolor/scalable/apps/screencloud.svg|g' $SNAPCRAFT_PART_INSTALL/usr/share/applications/net.screencloud.screencloudapp.desktop
    after: [quazip, pythonqt]

  quazip:
    source: https://github.com/stachenov/quazip.git
    source-commit: v1.4
    plugin: cmake
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
    build-packages:
      - g++
      - zlib1g-dev
      - qt6-base-dev
    stage-packages:
      - zlib1g
      - libqt6core6t64
      - libqt6core5compat6

  pythonqt:
    source: https://github.com/mevislab/PythonQt.git
    source-commit: v4.0.1
    plugin: nil
    build-packages:
      - g++
      - qmake6
      - qt6-base-dev
      - qt6-tools-dev
      - libgl-dev
      - python3-dev
      - python3.12
      - python3.12-dev
    stage-packages:
      - zlib1g
      - libqt6core6t64
      - libqt6gui6t64
      - libqt6xml6t64
      - libpython3.12t64
      - libqt6multimediawidgets6
      - libqt6opengl6t64
      - libqt6openglwidgets6t64
      - libqt6printsupport6t64
      - libqt6sql6t64
      - libqt6svgwidgets6
      - libqt6uitools6
    override-build: |
      set -e
      export NPROC=$(nproc || echo 2)
      cd $SNAPCRAFT_PART_BUILD
      PYTHON_BIN=$(which python3.12)
      PYTHON_PATH=$(python3.12 -c "import sys; print(sys.prefix)")
      PYTHON_VERSION=$(python3.12 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
      PYTHON_INCLUDE=$(python3.12 -c "import sysconfig; print(sysconfig.get_path('include'))")
      echo "Using Python: $PYTHON_BIN ($PYTHON_VERSION)"
      echo "Python include: $PYTHON_INCLUDE"
      # 1. Build the generator
      qmake6 CONFIG+=generator_only CONFIG+=Release \
        PYTHON_PATH="$PYTHON_PATH" \
        PYTHON_VERSION="$PYTHON_VERSION" \
        INCLUDEPATH+="$PYTHON_INCLUDE" \
        PythonQt.pro
      make -j$NPROC
      # 2. Run the generator — QTDIR must point to the Qt include root, not lib
      cd generator
      QTDIR=/usr/include/qt6 ./pythonqt_generator qtscript_masterinclude.h build_all.txt
      cd ..
      # 3. Build the full runtime (generator excluded)
      qmake6 CONFIG+=Release CONFIG+=exclude_generator PREFIX=/usr \
        PYTHON_PATH="$PYTHON_PATH" \
        PYTHON_VERSION="$PYTHON_VERSION" \
        INCLUDEPATH+="$PYTHON_INCLUDE" \
        PythonQt.pro
      make -j$NPROC
      make install INSTALL_ROOT=$SNAPCRAFT_PART_INSTALL

  python-stdlib:
    plugin: nil
    stage-packages:
      - libpython3.12-minimal
      - libpython3.12-stdlib

  ssh2-python:
    source: .
    plugin: python
    python-packages:
      - ssh2-python
